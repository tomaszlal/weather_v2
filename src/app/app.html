<div
  class="bg-slate-950 text-slate-100 min-h-screen font-sans relative overflow-x-hidden antialiased selection:bg-cyan-500 selection:text-white"
>
  <div
    class="fixed inset-0 z-0 bg-[url('https://images.unsplash.com/photo-1534088568595-a066f410bcda?q=80&w=2000&auto=format&fit=crop')] bg-cover bg-center filter brightness-[0.45] blur-[2px] scale-105"
  ></div>
  <div
    class="fixed inset-0 z-0 bg-gradient-to-b from-slate-950/80 via-slate-950/70 to-slate-950/90"
  ></div>

  <!-- HEADER  to change on component of Angular-->
  <header
    class="w-full bg-slate-900/80 backdrop-blur-md border-b border-slate-800/80 sticky top-0 z-50 px-4 lg:px-8 py-3.5 transition-all"
  >
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <!-- Logo -->
      <a href="#" class="flex items-center gap-2 text-2xl font-extrabold tracking-tight group">
        <span class="text-white">TOM'S</span>
        <span class="text-sky-400 group-hover:text-sky-300 transition-colors">WEATHER</span>
        <span
          class="text-xs bg-sky-500/20 text-sky-300 border border-sky-500/30 px-1.5 py-0.5 rounded font-semibold tracking-wider"
          >v2</span
        >
      </a>

      <!-- Search Bar -->
      <div class="relative w-full sm:w-80 md:w-96">
        <input
          type="text"
          placeholder="Szukaj miasta lub kodu..."
          class="w-full bg-slate-800/90 text-sm text-slate-200 placeholder-slate-400 pl-10 pr-4 py-2.5 rounded-full border border-slate-700/60 focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20 transition-all shadow-inner"
        />
        <i
          data-lucide="search"
          class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"
        ></i>
      </div>
    </div>
  </header>

  <div class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      <div
        class="lg:col-span-6 bg-slate-900/75 backdrop-blur-md border border-slate-800/80 rounded-2xl sm:rounded-3xl p-4 flex flex-col justify-between shadow-2xl relative overflow-hidden group min-h-[360px]"
      >
        <app-map class="absolute inset-0 z-0"></app-map>
      </div>
      <div
        class="lg:col-span-6 bg-slate-900/75 backdrop-blur-md border border-slate-800/80 rounded-2xl sm:rounded-3xl p-6 lg:p-8 flex flex-col justify-between shadow-2xl relative overflow-hidden"
      >
        <app-current-weather
          class="flex flex-wrap items-center justify-between gap-2 border-slate-800/80 pb-4 mb-6"
        ></app-current-weather>
      </div>
    </div>
  </div>
  <router-outlet />
</div>
